server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Taille max upload (images projets, logos)
    client_max_body_size 50M;

    # Logs
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Routes Livewire (JS/uploads servis par Laravel, pas des fichiers statiques)
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    # Assets statiques — cache long
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    # Storage public (uploads Filament)
    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Routes Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_read_timeout    300;
        fastcgi_buffer_size     16k;
        fastcgi_buffers         4 16k;
    }

    # Sécurité — bloquer accès aux fichiers sensibles
    location ~ /\.(ht|env|git) {
        deny all;
        return 404;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
